# TDNS MP Auditor Configuration (sample)
#
# tdns-mpauditor is a read-only multi-provider observer. It takes part
# in the HSYNC3 protocol — receiving BEATs, HELLOs, PINGs and
# SYNC/UPDATE/RFI messages, and joining gossip — but never contributes
# zone data. It has no combiner or signer of its own.
#
# `tdns-mpcli configure` writes a config of this shape for a single-host
# testbed. This sample documents the same keys plus optional ones, on
# the same port layout: auditor DNS 8056, management API 7056, sync
# API 9056; combiner DNS 8055.

multi-provider:
   role:           auditor
   identity:       auditor.alpha.example.
   supported_mechanisms: [ dns ]
   long_term_jose_priv_key: /etc/tdns/keys/auditor.jose.priv.json
   # Agent identities authorized to communicate with the auditor, in
   # addition to those found through HSYNC3.
   # authorized_peers:
   #    - agent.alpha.example.
   #    - agent.bravo.example.
   # The auditor's identity zone, created and signed at startup.
   local:
      nameservers:   [ ]
      notify:        [ ]
   xfr:
      outgoing:
         addresses:  []
         auth:       []
      incoming:
         addresses:  []
         auth:       []
   api:
      addresses:
         publish:    []
         listen:     [ '127.0.0.1:9056' ]
      baseurl:       https://api.{TARGET}:{PORT}/api/v1
      port:          9056
      certfile:      /etc/tdns/certs/auditor.crt
      keyfile:       /etc/tdns/certs/auditor.key
   dns:
      addresses:
         publish:    [ 198.51.100.1 ]
         listen:     [ '0.0.0.0:8056' ]
      baseurl:       dns://dns.{TARGET}:{PORT}/
      port:          8056
      # chunk_mode:           edns0      # edns0 (default) | query
      # chunk_query_endpoint: include    # include | none; needed with chunk_mode: query
   syncengine:
      intervals:
         beatinterval:        30
         helloretry:          15
         discoveryretry:      15
         reconcile:           60
         hello_fast_attempts: 3
         hello_fast_interval: 2

service:
   name:           TDNS-MPAUDITOR
   verbose:        true
   debug:          false

listeners:
   addresses:      [ '0.0.0.0:8056' ]
   transports:     [ do53 ]

apiserver:
   addresses:      [ '127.0.0.1:7056' ]
   apikey:         change-me-to-something-secret
   certfile:       /etc/tdns/certs/auditor.crt
   keyfile:        /etc/tdns/certs/auditor.key

imrengine:
   active:         true
   require-dnssec-validation: true

# The policy the auditor signs its identity zone with (testbed values;
# see tdns-mpagent.sample.yaml).
dnssec:
   kasp:
      propagation-delay:  5m
   policies:
      default:
         algorithm:   ED25519
         ksk:
            lifetime:  forever
         zsk:
            lifetime:  forever
         csk:
            lifetime:  none
         sigvalidity:
            default:   6h
            dnskey:    6h
            ds:        6h

db:
   file:  /var/lib/tdns/tdns-mpauditor.db

log:
   file:   /var/log/tdns/tdns-mpauditor.log
   level:  info
   # subsystems:
   #    transport:  debug
   #    auditor:    info

audit:
   event_log:
      retention:        168h   # how long events are kept (default: 1 week)
      prune_interval:   1h     # how often the pruner runs (default: 1h)
   silence_threshold:   90s    # provider silent if no BEAT within this (default: 90s)
   detector_interval:   30s    # how often detectors run (default: 30s)
   web:
      enabled:          false           # web dashboard off by default
      addresses:        [ '127.0.0.1:8099' ]
      certfile:         ""              # set both cert and key for HTTPS
      keyfile:          ""              # empty cert+key disables HTTPS (lab only)
      auth:
         mode:          basic           # "basic" or "none" (none requires loopback bind)
         idle_timeout:  30m             # session expires after this much inactivity
         users_file:    /etc/tdns/tdns-auditor-users.yaml
         #   Manage with:
         #     tdns-mpcli auditor web user create --name <name>
         #     tdns-mpcli auditor web user list
         #     tdns-mpcli auditor web user delete --name <name>
         #     tdns-mpcli auditor web user reload   # apply changes to running auditor

# Zones can live in a separate file pulled in with a top-level
# "include:" entry.
templates:
   - name:           mpzone
     type:           secondary
     store:          map
     # The auditor observes each zone as a combiner holds it.
     primaries:      [ { addr: '127.0.0.1:8055', key: NOKEY } ]
     options:        [ multi-provider ]

zones:
   - name:           mptest.example.
     template:       mpzone
