# TDNS MP CLI Configuration (sample)
#
# tdns-mpcli is the management CLI for the tdns-mp daemons. Each
# apiservers entry is one daemon. The names below are the lookup keys of
# the built-in command words:
#   tdns-mpcli signer ...    → tdns-mpsigner
#   tdns-mpcli combiner ...  → tdns-mpcombiner
#   tdns-mpcli agent ...     → tdns-mpagent
#   tdns-mpcli auditor ...   → tdns-mpauditor
#
# A SECOND (third, ...) instance of a daemon kind gets an entry with a
# "role:" field. Its "name" becomes both the command word and the lookup
# key, and it offers the same command set as the built-in word:
#   tdns-mpcli p2-agent ping → the entry named p2-agent (role: agent)
# See the commented entry at the end of apiservers below.
#
# config-file: is the daemon's own config, read by "... config check" and
# "... keys"; command: is what "... daemon start" runs.
#
# The config file: --config, else $TDNS_MPCLI_CONFIG, else
# /etc/tdns/tdns-mpcli.yaml. `tdns-mpcli configure` generates one.

# Pull in shared algorithm enrichment data so that
# `signer keystore dnssec algorithms` prints the rich table (sizes,
# maturity, descriptions) instead of a bare name/codepoint list. A
# missing included file is silently skipped. See algorithms.sample.yaml
# (shipped with tdns) for the format.
include:
   - /etc/tdns/algorithms.yaml

apiservers:
   - name:         tdns-mpsigner
     baseurl:      https://127.0.0.1:7053/api/v1
     apikey:       change-me-to-something-secret
     authmethod:   X-API-Key
     config-file:  /etc/tdns/tdns-mpsigner.yaml
     command:      /usr/local/libexec/tdns-mpsigner

   - name:         tdns-mpcombiner
     baseurl:      https://127.0.0.1:7055/api/v1
     apikey:       change-me-to-something-secret
     authmethod:   X-API-Key
     config-file:  /etc/tdns/tdns-mpcombiner.yaml
     command:      /usr/local/libexec/tdns-mpcombiner

   - name:         tdns-mpagent
     baseurl:      https://127.0.0.1:7054/api/v1
     apikey:       change-me-to-something-secret
     authmethod:   X-API-Key
     config-file:  /etc/tdns/tdns-mpagent.yaml
     command:      /usr/local/libexec/tdns-mpagent

   - name:         tdns-mpauditor
     baseurl:      https://127.0.0.1:7056/api/v1
     apikey:       change-me-to-something-secret
     authmethod:   X-API-Key
     config-file:  /etc/tdns/tdns-mpauditor.yaml
     command:      /usr/local/libexec/tdns-mpauditor

   # A second agent instance, addressed as "tdns-mpcli p2-agent ...".
   # role: picks the command tree (agent | combiner | signer | auditor);
   # the name must not be one of those four words, nor "version",
   # "configure", "show-cmds", "help" or "completion".
   # - name:         p2-agent
   #   role:         agent
   #   baseurl:      https://127.0.0.1:7254/api/v1
   #   apikey:       change-me-to-something-secret
   #   authmethod:   X-API-Key
   #   config-file:  /etc/tdns/p2/tdns-mpagent.yaml
   #   command:      /usr/local/libexec/tdns-mpagent

log:
   file:   /var/log/tdns/tdns-mpcli.log
   level:  info
