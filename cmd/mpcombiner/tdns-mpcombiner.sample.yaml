# TDNS MP Combiner Configuration (sample)
#
# tdns-mpcombiner is where zone data enters a provider. It takes the
# zone owner's zone, merges the contributions agents send for it, and
# hands the combined zone to the signer. It does not sign.
#
# `tdns-mpcli configure` writes a config of this shape for a single-host
# testbed, together with keys, certificates and an example zone. This
# sample documents the same keys plus optional ones, on the same port
# layout: combiner DNS 8055, management API 7055; agent DNS 8054;
# signer DNS 8053.

multi-provider:
   role:      combiner
   identity:  combiner.alpha.example.
   long_term_jose_priv_key:  /etc/tdns/keys/combiner.jose.priv.json

   # chunk_mode:           edns0      # edns0 (default) | query
   # chunk_query_endpoint: include    # include | none; needed with chunk_mode: query

   # Agents whose contributions this combiner accepts.
   agents:
      - identity:               agent.alpha.example.
        address:                '127.0.0.1:8054'
        long_term_jose_pub_key: /etc/tdns/keys/agent.jose.pub.json

   # Add a TXT record to every combined zone ({identity} and {zone} are
   # substituted).
   # combiner-options:  [ add-signature ]
   # signature:         "combined by {identity}"

   # NS targets under these suffixes belong to this provider; an agent
   # of another provider cannot add NS records pointing into them.
   # protected-namespaces:
   #    - alpha.example.

   # Zones of this provider's own where agents may make targeted edits
   # (e.g. _signal KEY records at NS delegation names).
   # provider-zones:
   #    - zone:              alpha.example.
   #      allowed-rrtypes:   [ KEY ]

   # HTTPS sync API for inbound HELLO/BEAT/PING, as an alternative to
   # NOTIFY+CHUNK.
   # syncapi:
   #    addresses:
   #       listen:     [ '127.0.0.1:8992' ]
   #    certfile:      /etc/tdns/certs/combiner.crt
   #    keyfile:       /etc/tdns/certs/combiner.key

service:
   name:           TDNS-MPCOMBINER
   verbose:        true
   debug:          false
   # Optional clamps on the SOA Refresh value used for secondary
   # zones. Both default in code (min 60s, max 8h) when unset.
   # minrefresh:     60       # seconds, floor for SOA Refresh
   # maxrefresh:     1800     # seconds, ceiling for SOA Refresh

listeners:
   addresses:      [ '0.0.0.0:8055' ]
   transports:     [ do53 ]

authengine:
   # Keep the SOA serial handed to the signer across restarts.
   outbound-soa-serial:  persist

apiserver:
   addresses:      [ '127.0.0.1:7055' ]
   apikey:         change-me-to-something-secret
   certfile:       /etc/tdns/certs/combiner.crt
   keyfile:        /etc/tdns/certs/combiner.key

db:
   file:  /var/lib/tdns/tdns-mpcombiner.db

log:
   file:   /var/log/tdns/tdns-mpcombiner.log
   level:  info
   # subsystems:
   #    transport:  debug
   #    combiner:   debug

# Zones can live in a separate file pulled in with a top-level
# "include:" entry.
templates:
   - name:           mpzone
     store:          map
     options:        [ multi-provider ]
     # The local roles that transfer the combined zone.
     notify:         [ { addr: '127.0.0.1:8053', key: NOKEY } ]
     downstreams:    [ { prefix: '127.0.0.1/32', key: NOKEY } ]

zones:
   # A zone loaded from a file, standing in for the zone owner.
   - name:           mptest.example.
     template:       mpzone
     type:           primary
     zonefile:       /etc/tdns/zones/mptest.example.zone

   # A customer zone: a secondary of the zone owner's primary, which
   # allows this combiner to transfer the zone and NOTIFYs it.
   # - name:           customer.example.
   #   template:       mpzone
   #   type:           secondary
   #   primaries:      [ { addr: '203.0.113.53:53', key: NOKEY } ]
