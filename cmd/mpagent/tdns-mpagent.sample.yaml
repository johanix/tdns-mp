# TDNS MP Agent Configuration (sample)
#
# tdns-mpagent is the multi-provider DNSSEC agent. It uses tdns for DNS
# infrastructure (zone serving, refresh, NOTIFY, query handling, the
# internal resolver) and adds the MP engines (HSYNC sync engine, SDE,
# heartbeats, discovery, leader election, CHUNK transport, gossip).
#
# `tdns-mpcli configure` writes a config of this shape for a single-host
# testbed, together with keys, certificates and an example zone. This
# sample documents the same keys plus optional ones, on the same port
# layout: agent DNS 8054, management API 7054, sync API 9054; combiner
# DNS 8055; signer DNS 8053.

multi-provider:
   role:           agent
   identity:       agent.alpha.example.
   # Active transport mechanisms: "api" and/or "dns". "dns" (NOTIFY+CHUNK
   # over DNS) is the one in use.
   supported_mechanisms: [ dns ]
   # JOSE key pair that signs and encrypts CHUNK traffic.
   long_term_jose_priv_key: /etc/tdns/keys/agent.jose.priv.json
   # Payload-crypto backend; "jose" is the default and the only one.
   # crypto_backend: jose
   combiner:
      identity:                combiner.alpha.example.
      address:                 '127.0.0.1:8055'
      long_term_jose_pub_key:  /etc/tdns/keys/combiner.jose.pub.json
   signer:
      identity:                signer.alpha.example.
      address:                 '127.0.0.1:8053'
      long_term_jose_pub_key:  /etc/tdns/keys/signer.jose.pub.json
   # Agent identities authorized to communicate with this agent, in
   # addition to those found through HSYNC3.
   # authorized_peers:
   #    - agent.bravo.example.
   # The agent's identity zone, created and signed at startup.
   local:
      # NS RDATA of the identity zone.
      nameservers:   [ ns1.alpha.example. ]
      # Secondaries of the identity zone, NOTIFYed on every change.
      notify:        [ '192.0.2.10:53' ]
   remote:
      LocateInterval: 60
   xfr:
      outgoing:
         addresses:  []
         auth:       []
      incoming:
         addresses:  []
         auth:       []
   # HTTPS endpoint of the "api" transport. The agent always starts its
   # sync API on the listen addresses; publish advertises it to peers.
   api:
      addresses:
         publish:    []
         listen:     [ '127.0.0.1:9054' ]
      baseurl:       https://api.{TARGET}:{PORT}/api/v1
      port:          9054
      certfile:      /etc/tdns/certs/agent.crt
      keyfile:       /etc/tdns/certs/agent.key
   # DNS endpoint of the "dns" transport. listen must be an address the
   # listeners: block binds; publish is what peers are told.
   dns:
      addresses:
         publish:    [ 198.51.100.1 ]
         listen:     [ '0.0.0.0:8054' ]
      baseurl:       dns://dns.{TARGET}:{PORT}/
      port:          8054
      # chunk_mode:           edns0      # edns0 (default) | query
      # chunk_query_endpoint: include    # include | none; needed with chunk_mode: query
   # Protocol timers in seconds; these are the defaults.
   syncengine:
      intervals:
         beatinterval:        30
         helloretry:          15
         discoveryretry:      15
         reconcile:           60
         hello_fast_attempts: 3
         hello_fast_interval: 2

service:
   name:           TDNS-MPAGENT
   verbose:        true
   debug:          false
   # Optional clamps on the SOA Refresh value used for secondary
   # zones. Both default in code (min 60s, max 8h) when unset.
   # minrefresh:     60       # seconds, floor for SOA Refresh
   # maxrefresh:     1800     # seconds, ceiling for SOA Refresh

listeners:
   addresses:      [ '0.0.0.0:8054' ]
   transports:     [ do53 ]

apiserver:
   addresses:      [ '127.0.0.1:7054' ]
   apikey:         change-me-to-something-secret
   certfile:       /etc/tdns/certs/agent.crt
   keyfile:        /etc/tdns/certs/agent.key

# Leader-election lease for zones whose HSYNCPARAM says
# parentsync="agent". 60m is the default.
# delegationsync:
#    leader-election-ttl: 60m

# Delegation sync towards the parent of a customer zone whose
# HSYNCPARAM makes the agents responsible for it (parentsync="agent").
parentsync:
   schemes:     [ notify, update ]
   update:
      keygen:
         algorithm:  ED25519

imrengine:
   active:         true
   require-dnssec-validation: true

# The policy the agent signs its identity zone with. Testbed values:
# a signature validity must exceed 2 x (largest served TTL +
# kasp.propagation-delay), and tdns warns below 4 x.
dnssec:
   kasp:
      propagation-delay:  5m
   policies:
      default:
         algorithm:   ED25519
         ksk:
            lifetime:  forever
         zsk:
            lifetime:  forever
         csk:
            lifetime:  none
         sigvalidity:
            default:   6h
            dnskey:    6h
            ds:        6h

db:
   file:  /var/lib/tdns/tdns-mpagent.db

log:
   file:   /var/log/tdns/tdns-mpagent.log
   level:  info
   # subsystems:
   #    transport:  debug
   #    engine:     debug
   #    agent:      info

# Zones can live in a separate file pulled in with a top-level
# "include:" entry.
templates:
   - name:           mpzone
     type:           secondary
     store:          map
     # The agent serves the signed zone it pulls from the local signer.
     primaries:      [ { addr: '127.0.0.1:8053', key: NOKEY } ]
     options:        [ multi-provider ]

zones:
   - name:           mptest.example.
     template:       mpzone
