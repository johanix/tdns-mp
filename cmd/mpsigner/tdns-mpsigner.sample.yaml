# TDNS MP Signer Configuration (sample)
#
# tdns-mpsigner is the multi-provider DNSSEC signer: a tdns
# authoritative server that pulls the combined zone from the combiner,
# signs it when HSYNCPARAM makes this provider a signer, and serves it.
# It also runs the MP key-state protocol with the agent (KEYSTATE over
# CHUNK).
#
# `tdns-mpcli configure` writes a config of this shape for a single-host
# testbed, together with keys, certificates and an example zone. This
# sample documents the same keys plus optional ones, on the same port
# layout: signer DNS 8053 and 53, management API 7053; combiner DNS
# 8055; agent DNS 8054.

multi-provider:
   role:      signer
   # false: accept traffic but sign nothing (retiring a signer).
   active:    true
   identity:  signer.alpha.example.
   long_term_jose_priv_key:  /etc/tdns/keys/signer.jose.priv.json

   # chunk_mode:           edns0      # edns0 (default) | query
   # chunk_query_endpoint: include    # include | none; needed with chunk_mode: query

   # The local agent.
   agents:
      - identity:               agent.alpha.example.
        address:                '127.0.0.1:8054'
        long_term_jose_pub_key: /etc/tdns/keys/agent.jose.pub.json

   # HTTPS sync API for inbound HELLO/BEAT/PING from the agent, as an
   # alternative to NOTIFY+CHUNK.
   # syncapi:
   #    addresses:
   #       listen:     [ '127.0.0.1:8991' ]
   #    certfile:      /etc/tdns/certs/signer.crt
   #    keyfile:       /etc/tdns/certs/signer.key

service:
   name:           TDNS-MPSIGNER
   verbose:        true
   debug:          false
   # Optional clamps on the SOA Refresh value used for secondary
   # zones. Both default in code (min 60s, max 8h) when unset.
   # minrefresh:     60       # seconds, floor for SOA Refresh
   # maxrefresh:     1800     # seconds, ceiling for SOA Refresh

listeners:
   # The high port for the local roles, 53 for everyone else.
   addresses:      [ '0.0.0.0:8053', '0.0.0.0:53' ]
   transports:     [ do53 ]

authengine:
   # Keep the SOA serial served to the agent across restarts.
   outbound-soa-serial:  persist

apiserver:
   addresses:      [ '127.0.0.1:7053' ]
   apikey:         change-me-to-something-secret
   certfile:       /etc/tdns/certs/signer.crt
   keyfile:        /etc/tdns/certs/signer.key

# Seconds between re-signing passes (clamped to 60..3600; 60 when
# unset).
# resignerengine:
#    interval:     300

dnssec:
   # Key and Signing Policy for the key-state worker.
   kasp:
      propagation-delay:  5m     # before published -> standby, retired -> removed
      check-interval:     1m
      standby-zsk-count:  1
      standby-ksk-count:  0
   policies:
      default:
         algorithm:  ED25519
         ksk:
            lifetime:  forever
         zsk:
            lifetime:  forever
         csk:
            lifetime:  none
         # Testbed values: dnskey for the DNSKEY RRset, ds for DS
         # RRsets, default for everything else. Each must exceed
         # 2 x (largest served TTL + kasp.propagation-delay); tdns
         # warns below 4 x.
         sigvalidity:
            default:   6h
            dnskey:    6h
            ds:        6h

db:
   file:  /var/lib/tdns/tdns-mpsigner.db

log:
   file:   /var/log/tdns/tdns-mpsigner.log
   level:  info
   # subsystems:
   #    transport:  debug
   #    signer:     debug

# Zones can live in a separate file pulled in with a top-level
# "include:" entry.
templates:
   - name:           mpzone
     type:           secondary
     store:          map
     primaries:      [ { addr: '127.0.0.1:8055', key: NOKEY } ]
     options:        [ multi-provider ]
     dnssecpolicy:   default
     notify:         [ { addr: '127.0.0.1:8054', key: NOKEY } ]
     downstreams:    [ { prefix: '127.0.0.1/32', key: NOKEY } ]

zones:
   - name:           mptest.example.
     template:       mpzone
